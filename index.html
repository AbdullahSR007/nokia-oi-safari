<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Nokia OI Safari Offline PWA v1.0.8</title>
<style>
:root{
  --bg:#020817;--sf:#0f172a;--sf2:#1e293b;--bd:#334155;
  --p:#005aff;--cy:#06b6d4;--gr:#22c55e;--yl:#f59e0b;--rd:#ef4444;--pu:#a855f7;
  --t:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#root{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}

/* HEADER */
.hdr{background:linear-gradient(135deg,#020817 0%,#050f2a 100%);border-bottom:1px solid var(--bd);padding:10px 16px 8px;flex-shrink:0}
.hdr-top{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
.hdr-title{flex:1}
.hdr-title h1{font-size:15px;font-weight:700;color:var(--t);letter-spacing:.3px}
.hdr-title p{font-size:11px;color:var(--t3);margin-top:1px}
.signal-bars{display:flex;align-items:flex-end;gap:2px;height:18px}
.signal-bars span{width:4px;background:var(--p);border-radius:1px;opacity:.3;transition:height .3s,opacity .3s}
.signal-bars span:nth-child(1){height:6px}
.signal-bars span:nth-child(2){height:9px}
.signal-bars span:nth-child(3){height:12px}
.signal-bars span:nth-child(4){height:15px}
.signal-bars span:nth-child(5){height:18px}
.signal-bars.active span{opacity:1;animation:pulse-bar .6s ease-in-out infinite alternate}
.signal-bars.active span:nth-child(1){animation-delay:0s}
.signal-bars.active span:nth-child(2){animation-delay:.1s}
.signal-bars.active span:nth-child(3){animation-delay:.2s}
.signal-bars.active span:nth-child(4){animation-delay:.3s}
.signal-bars.active span:nth-child(5){animation-delay:.4s}
@keyframes pulse-bar{from{opacity:.4}to{opacity:1}}
.src-strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.src-strip::-webkit-scrollbar{display:none}
.src-chip{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid var(--bd);color:var(--t2);background:var(--sf)}
.src-chip.active{border-color:var(--p);color:var(--p)}

/* SEARCH BAR */
.search-wrap{padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.search-row{display:flex;gap:8px;align-items:center}
.search-input-wrap{flex:1;display:flex;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:0 10px;gap:8px}
.search-input-wrap svg{flex-shrink:0;color:var(--t3)}
.search-input{flex:1;background:none;border:none;outline:none;color:var(--t);font-size:15px;height:38px;caret-color:var(--p)}
.search-input::placeholder{color:var(--t3)}
.clear-btn{background:none;border:none;color:var(--t3);padding:4px;cursor:pointer;display:none}
.search-input:not(:placeholder-shown) ~ .clear-btn{display:block}
.icon-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;cursor:pointer}
.icon-btn.active{border-color:var(--p);color:var(--p);background:#0d1e3d}
.hist-chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.hist-chips::-webkit-scrollbar{display:none}
.hist-chip{padding:4px 10px;border-radius:16px;border:1px solid var(--bd);font-size:12px;color:var(--t2);background:none;white-space:nowrap;cursor:pointer;flex-shrink:0}
.hist-chip:active{background:var(--sf2)}

/* MAIN CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* RESULT META */
.result-meta{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);flex-shrink:0}
.result-count{font-size:12px;color:var(--t3)}
.meta-btns{display:flex;gap:6px}
.mini-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--t2);cursor:pointer;white-space:nowrap}
.mini-btn:active{opacity:.7}

/* RESULT CARDS */
.results-list{padding:8px}
.result-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.result-card:active{border-color:var(--p)}
.card-hdr{padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-site{font-size:14px;font-weight:700;color:var(--t);word-break:break-all}
.tech-badge{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.tech-2g{background:#052e16;color:var(--gr);border:1px solid #16a34a}
.tech-4g{background:#1e3a5f;color:#60a5fa;border:1px solid #2563eb}
.tech-5g{background:#2d1b69;color:#c084fc;border:1px solid #7c3aed}
.tech-hw{background:#1a1a2e;color:var(--cy);border:1px solid var(--cy)}
.tech-un{background:var(--sf2);color:var(--t3);border:1px solid var(--bd)}
.card-src{font-size:10px;color:var(--t3);padding:0 12px;margin-bottom:6px}
.card-fields{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:4px}
.card-kv{font-size:11px;color:var(--t2)}
.card-kv span{color:var(--t3);margin-right:2px}
.card-kv b{color:var(--t)}
.empty-state{text-align:center;padding:60px 24px;color:var(--t3)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state h3{font-size:15px;color:var(--t2);margin-bottom:6px}
.empty-state p{font-size:13px;line-height:1.5}

/* IMPORT TAB */
.import-wrap{padding:16px}
.import-zone{border:2px dashed var(--bd);border-radius:16px;padding:32px 16px;text-align:center;background:var(--sf);margin-bottom:16px}
.import-zone svg{color:var(--t3);margin-bottom:12px}
.import-zone p{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--p);color:#fff}
.btn-secondary{background:var(--sf2);color:var(--t);border:1px solid var(--bd)}
.btn-danger{background:#450a0a;color:var(--rd);border:1px solid #991b1b}
.file-input{display:none}
.sources-list{display:flex;flex-direction:column;gap:8px}
.source-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.source-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.source-name{font-size:13px;font-weight:700;color:var(--t);word-break:break-all}
.source-meta{font-size:11px;color:var(--t3);margin-top:2px}
.source-tech-badge{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}
.source-remove{background:none;border:none;color:var(--t3);padding:4px;cursor:pointer}
.source-headers{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.header-tag{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;font-size:10px;color:var(--t3);font-family:ui-monospace,'SF Mono',monospace}
.section-title{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}

/* ANALYZE TAB */
.analyze-wrap{padding:12px}
.analyze-intro{font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.5}
.query-grid{display:flex;flex-direction:column;gap:8px}
.query-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s}
.query-card:active{border-color:var(--p)}
.query-card.running{border-color:var(--cy)}
.query-num{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.query-title{font-size:13px;font-weight:700;color:var(--t);margin-bottom:4px}
.query-desc{font-size:11px;color:var(--t2);line-height:1.4}

/* BSC TAB */
.bsc-wrap{padding:12px}
.bsc-search{display:flex;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:0 10px;gap:8px;margin-bottom:12px}
.bsc-search input{flex:1;background:none;border:none;outline:none;color:var(--t);font-size:14px;height:38px}
.bsc-search input::placeholder{color:var(--t3)}
.bsc-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bsc-table{width:100%;border-collapse:collapse;font-size:11px}
.bsc-table th{padding:7px 8px;text-align:left;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:var(--sf);white-space:nowrap;font-size:10px}
.bsc-table td{padding:7px 8px;color:var(--t);border-bottom:1px solid #1a2332;white-space:nowrap;font-family:ui-monospace,'SF Mono',monospace;font-size:11px}
.bsc-table tr:active td{background:var(--sf2)}
.bsc-city-badge{padding:2px 6px;border-radius:6px;font-size:9px;font-weight:700}

/* AI TAB */
.ai-wrap{display:flex;flex-direction:column;height:100%}
.ai-config{padding:12px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0}
.ai-config-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ai-config-row:last-child{margin-bottom:0}
.ai-label{font-size:11px;color:var(--t3);width:70px;flex-shrink:0}
.ai-input{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--t);font-size:13px;outline:none}
.ai-input:focus{border-color:var(--p)}
.ai-messages{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.ai-msg{margin-bottom:12px;display:flex;gap:8px}
.ai-msg.user{flex-direction:row-reverse}
.ai-bubble{max-width:85%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.5}
.ai-bubble.user{background:var(--p);color:#fff;border-bottom-right-radius:4px}
.ai-bubble.assistant{background:var(--sf2);color:var(--t);border-bottom-left-radius:4px;border:1px solid var(--bd)}
.ai-bubble pre{font-family:ui-monospace,'SF Mono',monospace;font-size:10px;overflow-x:auto;background:#0d1525;padding:8px;border-radius:6px;margin-top:6px;white-space:pre-wrap;word-break:break-all}
.ai-input-row{padding:8px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;padding-bottom:max(8px,calc(var(--sb) + 4px));flex-shrink:0}
.ai-text-input{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;color:var(--t);font-size:14px;outline:none;resize:none;font-family:inherit;max-height:100px;-webkit-appearance:none}
.ai-text-input::placeholder{color:var(--t3)}
.ai-send-btn{background:var(--p);border:none;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0;-webkit-appearance:none}
.ai-send-btn:disabled{opacity:.4}

/* TAB BAR */
.tab-bar{display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:var(--sb);flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;border:none;background:none;color:var(--t3);font-size:9px;font-weight:600;gap:3px;transition:color .15s;text-transform:uppercase;letter-spacing:.4px}
.tab-item.active{color:var(--p)}
.tab-item svg{width:22px;height:22px}

/* MODAL SHEET */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-height:90vh;display:flex;flex-direction:column;padding-bottom:calc(var(--sb) + 8px)}
.modal-drag{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:12px auto 0}
.modal-title{padding:12px 16px;font-size:16px;font-weight:700;color:var(--t);border-bottom:1px solid var(--bd)}
.modal-body{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.modal-footer{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.modal-row:last-child{border-bottom:none}
.modal-row-label{font-size:14px;color:var(--t)}
.modal-row-val{font-size:13px;color:var(--t2);font-family:ui-monospace,'SF Mono',monospace;text-align:right;max-width:60%;word-break:break-all}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.checkbox-row input{width:18px;height:18px;accent-color:var(--p)}
.checkbox-label{font-size:13px;color:var(--t)}
.result-block{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px;font-size:12px;line-height:1.6;color:var(--t2);font-family:ui-monospace,'SF Mono',monospace;white-space:pre-wrap;overflow-x:auto}
.result-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.result-table th{padding:6px 8px;background:var(--sf2);color:var(--t3);font-weight:700;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:10px}
.result-table td{padding:6px 8px;color:var(--t);border-bottom:1px solid #1a2332;white-space:nowrap;font-family:ui-monospace,'SF Mono',monospace}
.result-table tr:nth-child(even) td{background:#0d1420}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--sb) + 72px);left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;border:1px solid var(--bd);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--t);z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* UTILS */
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--t3)}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}
.fw{width:100%}
.hidden{display:none!important}

.mode-card.active{border-color:var(--p);background:#0d1e3d}
.mode-title{font-size:12px;font-weight:800;color:var(--t)}
.mode-desc{font-size:10px;color:var(--t3);line-height:1.35;margin-top:3px}
.progress-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.progress-track{height:8px;background:#0b1220;border-radius:999px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--p),var(--cy),var(--gr));width:0%;transition:width .18s ease}
.progress-text{font-size:11px;color:var(--t2);font-family:ui-monospace,'SF Mono',monospace;white-space:pre-wrap;max-height:90px;overflow:auto}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.dash-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;border-left:4px solid var(--p)}
.dash-card.green{border-left-color:var(--gr)}.dash-card.purple{border-left-color:var(--pu)}.dash-card.orange{border-left-color:var(--yl)}.dash-card.red{border-left-color:var(--rd)}.dash-k{font-size:10px;color:var(--t3);font-weight:800;text-transform:uppercase;letter-spacing:.4px}.dash-v{font-size:22px;font-weight:900;color:var(--t);margin-top:2px}.dash-n{font-size:10px;color:var(--t3);margin-top:2px}
.hdr-title h1{font-size:16px}
.result-card,.source-card,.query-card{box-shadow:0 6px 16px rgba(0,0,0,.12)}
.import-zone{background:linear-gradient(180deg,#0f172a,#0b1220)}


/* v1.0.8 offline PWA status */
.offline-pill{position:fixed;right:10px;bottom:calc(var(--sb) + 74px);z-index:90;background:#0f172a;border:1px solid #334155;color:#94a3b8;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.4px}
.offline-pill.ok{border-color:#22c55e;color:#22c55e}
.offline-pill.warn{border-color:#f59e0b;color:#f59e0b}


/* v1.0.8 AI offline + ChatGPT connect chips */
.ai-chip-row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.ai-chip-row::-webkit-scrollbar{display:none}
.ai-chip{background:#0b1220;border:1px solid var(--bd);border-radius:999px;color:var(--t2);font-size:10px;font-weight:800;padding:6px 9px;white-space:nowrap;cursor:pointer}
.ai-chip:active{opacity:.7}.ai-mode-note{font-size:11px;color:var(--t2);line-height:1.45;margin-top:6px}.ai-mode-note b{color:#22c55e}.ai-action-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:11px;font-weight:800;padding:7px 9px;white-space:nowrap;cursor:pointer}
.ai-action-btn.green{border-color:#16a34a;color:#22c55e}.ai-action-btn.blue{border-color:#2563eb;color:#60a5fa}.ai-action-btn.purple{border-color:#7c3aed;color:#c084fc}

function persist(){
  try{
    const p={history:S.history,apiKey:S.apiKey,hybridUrl:S.hybridUrl,importFull:S.importFull};
    // store only first 3 sources (can be large)
    localStorage.setItem('noi_state',JSON.stringify(p));
    // store source data separately
    const srcs=S.sources.map(s=>({id:s.id,name:s.name,headers:s.headers,tech:s.tech,color:s.color,
      rows:s.rows.slice(0,5000), previewCap:s.previewCap||null, fullRows:s.fullRows||s.rows.length})); // fast storage cache capped at 5k rows
    localStorage.setItem('noi_sources',JSON.stringify(srcs));
  }catch(e){/* storage full */}
}

function restore(){
  try{
    const p=JSON.parse(localStorage.getItem('noi_state')||'{}');
    S.history=p.history||[];
    S.apiKey=p.apiKey||'';
    S.hybridUrl=p.hybridUrl||'';
    S.importFull=!!p.importFull;
    S.importLimit=S.importFull?Infinity:5000;
    const srcs=JSON.parse(localStorage.getItem('noi_sources')||'[]');
    S.sources=srcs;
    colorIdx=S.sources.length;
  }catch(e){}
}

// ───────────────────────────────────────────────────────────
// CSV PARSER
// ───────────────────────────────────────────────────────────
function detectDelim(text){
  const s=text.slice(0,2000);
  const tabs=(s.match(/\t/g)||[]).length;
  const commas=(s.match(/,/g)||[]).length;
  const semis=(s.match(/;/g)||[]).length;
  if(tabs>commas&&tabs>semis) return '\t';
  if(semis>commas) return ';';
  return ',';
}

function parseCSV(text,delim){
  // Remove BOM
  text=text.replace(/^\uFEFF/,'');
  if(!delim) delim=detectDelim(text);
  const rows=[];
  let inQ=false,field='',row=[];
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'){
      if(inQ&&n==='"'){field+='"';i++;}
      else inQ=!inQ;
    } else if(c===delim&&!inQ){
      row.push(field);field='';
    } else if((c==='\n'||(c==='\r'&&n==='\n'))&&!inQ){
      if(c==='\r')i++;
      row.push(field);field='';
      if(row.some(x=>x.trim())) rows.push(row);
      row=[];
    } else {
      field+=c;
    }
  }
  if(field||row.length){row.push(field);if(row.some(x=>x.trim()))rows.push(row);}
  return rows;
}

function csvToObjects(text,limit=Infinity,onProgress=null){
  const rows=parseCSV(text);
  if(rows.length<1) return {headers:[],objs:[],totalRows:0,limited:false};
  let hi=0;
  while(hi<rows.length&&rows[hi].every(x=>!x.trim()))hi++;
  const headers=rows[hi].map(h=>h.trim());
  const objs=[];
  const totalRows=Math.max(0,rows.length-hi-1);
  for(let i=hi+1;i<rows.length;i++){
    if(!rows[i].some(x=>x.trim())) continue;
    const obj={};
    headers.forEach((h,j)=>{obj[h]=(rows[i][j]||'').trim();});
    objs.push(obj);
    if(onProgress && objs.length%1000===0) onProgress(objs.length,totalRows);
    if(objs.length>=limit) break;
  }
  return {headers,objs,totalRows,limited:objs.length<totalRows};
}

// ───────────────────────────────────────────────────────────
// COLUMN DETECTION HELPERS
// ───────────────────────────────────────────────────────────
function findCol(headers,aliases){
  const hLow=headers.map(h=>h.toLowerCase().replace(/[\s_\-\.]/g,''));
  for(const a of aliases){
    const al=a.toLowerCase().replace(/[\s_\-\.]/g,'');
    let i=hLow.indexOf(al);
    if(i>=0) return headers[i];
    i=hLow.findIndex(h=>h.includes(al)||al.includes(h));
    if(i>=0) return headers[i];
  }
  return null;
}

function cv(row,col){return col?(row[col]||'').toString().trim():'';}

function inferTech(src){
  const n=src.name.toLowerCase();
  if(/5g|nr|gn[bB]/.test(n)) return '5G';
  if(/4g|lte|enb|earfcn/.test(n)) return '4G';
  if(/2g|gsm|bsc|bts|trx/.test(n)) return '2G';
  if(/hw|hardware|serial|unit/.test(n)) return 'HW';
  // check headers
  const h=src.headers.join(' ').toLowerCase();
  if(/gnb|nrarfcn|5g/.test(h)) return '5G';
  if(/enb|earfcn|4g|lte/.test(h)) return '4G';
  if(/bsc|trx|bcch|gsm|2g/.test(h)) return '2G';
  if(/serial|unit_type|unittype|hwtype/.test(h)) return 'HW';
  return 'CM';
}

function normSite(s){
  return s.toUpperCase().replace(/[_\-\.\s]+/g,'').replace(/\d{1,3}$/,'');
}

// ───────────────────────────────────────────────────────────
// SEARCH ENGINE
// ───────────────────────────────────────────────────────────
function runSearch(query){
  if(!query.trim()||!S.sources.length){S.results=[];return;}
  const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  for(const src of S.sources){
    const cols=S.searchCols?[...S.searchCols]:src.headers;
    for(const row of src.rows){
      const text=cols.map(c=>(row[c]||'').toLowerCase()).join(' ');
      if(terms.every(t=>text.includes(t))){
        hits.push({_src:src.id,_srcName:src.name,_tech:src.tech,_color:src.color,...row});
      }
    }
  }
  // dedup if requested
  let final=hits;
  if(S.dedupKey){
    const seen=new Set();
    final=hits.filter(h=>{
      const k=cv(h,S.dedupKey);
      if(seen.has(k)) return false;
      seen.add(k);return true;
    });
  }
  // sort
  if(S.sortCol){
    final.sort((a,b)=>{
      const av=cv(a,S.sortCol).toLowerCase();
      const bv=cv(b,S.sortCol).toLowerCase();
      return S.sortAsc?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);
    });
  }
  S.results=final.slice(0,500);
}

function addHistory(q){
  if(!q.trim()) return;
  S.history=S.history.filter(h=>h!==q);
  S.history.unshift(q);
  S.history=S.history.slice(0,20);
  persist();
}

// ───────────────────────────────────────────────────────────
// ANALYTICS ENGINE – 20 QUERIES
// ───────────────────────────────────────────────────────────
function allRows(){
  const rows=[];
  for(const s of S.sources) for(const r of s.rows) rows.push({...r,_src:s.id,_tech:s.tech,_name:s.name,_hdrs:s.headers});
  return rows;
}

function hdr(src,aliases){
  return findCol(src.headers,aliases)||'';
}

// Q01 – Sites per BSC
function q01(){
  const map={};
  for(const s of S.sources){
    const bsc=hdr(s,['bsc','bscname','bsc_name']);
    const site=hdr(s,['site','sitename','bts','btsname','site_name','nodename','cellname']);
    if(!bsc) continue;
    for(const r of s.rows){
      const b=cv(r,bsc);const st=cv(r,site)||cv(r,bsc);
      if(!b) continue;
      if(!map[b]) map[b]=new Set();
      if(st) map[b].add(st);
    }
  }
  return Object.entries(map).sort((a,b)=>b[1].size-a[1].size)
    .map(([bsc,sites])=>({BSC:bsc,Sites:sites.size}));
}

// Q02 – TRX per BSC
function q02(){
  const map={};
  for(const s of S.sources){
    const bsc=hdr(s,['bsc','bscname','bsc_name']);
    if(!bsc) continue;
    for(const r of s.rows){
      const b=cv(r,bsc);
      if(!b) continue;
      map[b]=(map[b]||0)+1;
    }
  }
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([BSC,TRX])=>({BSC,TRX}));
}

    const bkp=hdr(s,['backup','isbackup','backupbts','backupsite','spare']);
    if(!site) continue;
    for(const r of s.rows){

// Q09 – Site Coordinate Mismatches
function q09(){
  const siteLat={},siteLon={};
  for(const s of S.sources){
    const site=hdr(s,['site','sitename']);
    const lat=hdr(s,['lat','latitude']);
    const lon=hdr(s,['lon','lng','longitude']);
    if(!site||!lat||!lon) continue;
    for(const r of s.rows){
      const st=cv(r,site),la=parseFloat(cv(r,lat)),lo=parseFloat(cv(r,lon));
      if(!st||isNaN(la)||isNaN(lo)) continue;
      if(!siteLat[st]){siteLat[st]=la;siteLon[st]=lo;}
      else {
        const dLat=Math.abs(siteLat[st]-la),dLon=Math.abs(siteLon[st]-lo);
        if(dLat>0.001||dLon>0.001){
          siteLat[st]='MISMATCH';
        }
      }
    }
  }
  const mis=Object.entries(siteLat).filter(([,v])=>v==='MISMATCH').map(([Site])=>({Site,Issue:'Coordinate mismatch across sources'}));
  return mis.length?mis:[{Site:'No coordinate mismatches found',Issue:''}];
}

// LTE Band from EARFCN
function lteBandFromEarfcn(e){
  const bands=[[0,599,'B1'],[600,1199,'B2'],[1200,1949,'B3'],[1950,2399,'B4'],
    [2400,2649,'B5'],[2650,2749,'B6'],[2750,3449,'B7'],[3450,3799,'B8'],
    [3800,4149,'B9'],[4150,4749,'B10'],[4750,4999,'B11'],[5000,5179,'B12'],
    [5180,5279,'B13'],[5280,5379,'B14'],[5730,5849,'B17'],[5850,5999,'B18'],
    [6000,6149,'B19'],[6150,6449,'B20'],[6450,6599,'B21'],[6600,7399,'B22'],
    [7500,7699,'B23'],[7700,8039,'B24'],[8040,8689,'B25'],[8690,9039,'B26'],
    [9040,9209,'B27'],[9210,9659,'B28'],[9660,9769,'B29'],[9770,9869,'B30'],
    [9870,9919,'B31'],[9920,10359,'B32'],[36000,36199,'B33'],[36200,36349,'B34'],
    [36350,36949,'B35'],[36950,37549,'B36'],[37550,37749,'B37'],[37750,38249,'B38'],
    [38250,38649,'B39'],[38650,39649,'B40'],[39650,41589,'B41'],
    [65536,66435,'B65'],[66436,67335,'B66'],[67336,67535,'B67'],[67536,67835,'B68']];
  for(const [lo,hi,band] of bands) if(e>=lo&&e<=hi) return band;
  return `B?`;
}

// NR Band from NR-ARFCN
function nrBandFromArfcn(a){
  if(a>=422000&&a<=434000) return 'n1';
  if(a>=386000&&a<=398000) return 'n3';
  if(a>=173800&&a<=178800) return 'n5';
  if(a>=524000&&a<=538000) return 'n7';
  if(a>=185000&&a<=192000) return 'n8';
  if(a>=145800&&a<=149200) return 'n12';
  if(a>=151600&&a<=153600) return 'n20';
  if(a>=158200&&a<=164200) return 'n28';
  if(a>=620000&&a<=680000) return 'n38';
  if(a>=693334&&a<=733334) return 'n40';
  if(a>=499200&&a<=537999) return 'n41';
  if(a>=2054166&&a<=2104165) return 'n77';
  if(a>=2016667&&a<=2070832) return 'n78';
  if(a>=2229166&&a<=2279165) return 'n79';
  if(a>=2270833&&a<=2337500) return 'n258';
  return 'nXX';
}


// Q21-Q60 smart fallback engine for additional reference questions
function qGeneric(qid){
  const titleMap={
    21:['LAC','BSC','cellId'],22:['BSC_Name','LAC'],23:['BSC_Name','BCCH'],24:['LAC','cellId'],
    25:['BSC_Name','SITE'],26:['SBTSId'],27:['SBTSId'],28:['AbisType'],29:['frequencyBandInUse'],30:['NCC','BCC'],
    31:['tac'],32:['ECI'],33:['LNBTSId','LNCELId'],34:['ChBw'],35:['earfcn','ChBw'],36:['earfcn','phyCellId'],
    37:['dlMimoMode'],38:['administrativeState','operationalState'],39:['mPlaneIpAddress','cPlaneIpAddress','uPlaneIpAddress'],40:['pMax'],
    41:['cellDepType'],42:['NMS','cellDepType'],43:['freqBandIndicatorNR'],44:['nrarfcn'],45:['chBw'],46:['nrCellType'],
    47:['actBeamforming'],48:['dlMimoMode'],49:['administrativeState','operationalState'],50:['arfcnSsbPbch','gscnOrSsPbchArfcn'],
    53:['SITE','NMS'],54:['activeSWReleaseVersion','NMS'],55:['mPlaneIpAddress'],56:['cPlaneIpAddress','uPlaneIpAddress'],
    57:['longitude','latitude'],58:['SITE','longitude','latitude']
  };
  if(qid===51 || qid===52 || qid===59 || qid===60){
    return techPresence(qid);
  }
  const aliases=titleMap[qid]||[];
  return smartGroupByAliases(aliases);
}
function smartGroupByAliases(aliases){
  const map={};
  for(const s of S.sources){
    const cols=aliases.map(a=>hdr(s,[a])).filter(Boolean);
    if(!cols.length) continue;
    for(const r of s.rows){
      const key=cols.map(c=>cv(r,c)||'?').join(' | ');
      if(!key || key.replace(/[ ?|]/g,'')==='') continue;
      map[key]=(map[key]||0)+1;
    }
  }
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,250).map(([Key,Rows])=>({Key,Rows}));
}
function techPresence(qid){
  const techSites={};
  for(const s of S.sources){
    const site=hdr(s,['SITE','site','sitename','bts','btsname','cellName','cellname']);
    if(!site) continue;
    for(const r of s.rows){
      const st=cv(r,site); if(!st) continue;
      const k=normSite(st);
      if(!techSites[k]) techSites[k]=new Set();
      techSites[k].add(s.tech);
    }
  }
  const rows=[];
  for(const [site,set] of Object.entries(techSites)){
    const has2=set.has('2G'),has4=set.has('4G'),has5=set.has('5G');
    if(qid===51 && ((has2&&!has4&&!has5)||(!has2&&has4&&!has5)||(!has2&&!has4&&has5))) rows.push({Site:site,Tech:[...set].join('+')});
    if(qid===52 && has2&&has4&&has5) rows.push({Site:site,Tech:'2G+4G+5G'});
    if(qid===59 && has4&&!has5) rows.push({Site:site,Status:'4G but no 5G'});
    if(qid===60 && has5&&!has4) rows.push({Site:site,Status:'5G but no 4G'});
  }
  return rows.slice(0,500);
}

function setImportProgress(msg,pct){
  S.importProgress=msg;
  if(typeof pct==='number') S.importPct=Math.max(0,Math.min(100,pct));
  const pt=document.getElementById('progressText');
  const pb=document.getElementById('progressBar');
  if(pt) pt.textContent=S.importProgress;
  if(pb) pb.style.width=S.importPct+'%';
}
function appendImportProgress(msg,pct){
  const line='['+new Date().toLocaleTimeString()+'] '+msg;
  S.importProgress=line+(S.importProgress?'\n'+S.importProgress:'');
  if(typeof pct==='number') S.importPct=Math.max(0,Math.min(100,pct));
  const pt=document.getElementById('progressText');
  const pb=document.getElementById('progressBar');
  if(pt) pt.textContent=S.importProgress;
  if(pb) pb.style.width=S.importPct+'%';
}
function setImportMode(full){
  S.importFull=!!full;
  S.importLimit=S.importFull?Infinity:5000;
  persist();
  render();
}
async function listZipCsvMembers(file){
  const ab=await file.arrayBuffer(); const dv=new DataView(ab); const u8=new Uint8Array(ab);
  function u16(o){return dv.getUint16(o,true)} function u32(o){return dv.getUint32(o,true)}
  let eocd=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(u32(i)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('ZIP end record not found');
  const total=u16(eocd+10), cdOffset=u32(eocd+16);
  let p=cdOffset, members=[];
  for(let i=0;i<total;i++){
    if(u32(p)!==0x02014b50)break;
    const method=u16(p+10), compSize=u32(p+20), uncompSize=u32(p+24), nameLen=u16(p+28), extraLen=u16(p+30), commentLen=u16(p+32), lho=u32(p+42);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nameLen));
    if(name.toLowerCase().match(/\.(csv|txt|tsv)$/)) members.push({name,method,compSize,uncompSize,lho,u8,dv});
    p += 46+nameLen+extraLen+commentLen;
  }
  return members;
}
async function zipMemberText(m){
  const dv=m.dv,u8=m.u8; function u16(o){return dv.getUint16(o,true)} function u32(o){return dv.getUint32(o,true)}
  const lp=m.lho; if(u32(lp)!==0x04034b50)throw new Error('ZIP local header not found');
  const nameLen=u16(lp+26), extraLen=u16(lp+28), dataStart=lp+30+nameLen+extraLen;
  const compressed=new Blob([u8.slice(dataStart,dataStart+m.compSize)]);
  let blob=compressed;
  if(m.method===8){
    if(typeof DecompressionStream==='undefined') throw new Error('Safari cannot decompress this ZIP here. Extract ZIP in Files and import CSV directly.');
    const ds=new DecompressionStream('deflate-raw');
    blob=await new Response(compressed.stream().pipeThrough(ds)).blob();
  } else if(m.method!==0){
    throw new Error('Unsupported ZIP compression method: '+m.method);
  }
  return await blob.text();
}
function detectTechFromMember(name,headers){
  const n=String(name||'').toLowerCase();
  const h=(headers||[]).join(' ').toLowerCase();
  if(/\b2g\b|gsm|bsc|bcf|bts/.test(n)) return '2G';
  if(/\b4g\b|lte|lnbts|lncel|eci/.test(n)) return '4G';
  if(/\b5g\b|nr|nrbts|nrcell|gnb/.test(n)) return '5G';
  if(/hw|hardware|serial|unit/.test(n)) return 'HW';
  if(/bscid|bcfid|btsid|bsc_name|bcch|num_trx/.test(h)) return '2G';
  if(/lnbtsid|lncelid|eci|earfcn|tac/.test(h)) return '4G';
  if(/nrbtsid|nrcellid|nrarfcn|freqbandindicatornr/.test(h)) return '5G';
  if(/unit_type|unittype|serial|id_code|vendor/.test(h)) return 'HW';
  return '';
}
async function importZipFile(file){
  appendImportProgress('Opening ZIP: '+file.name,5);
  const members=await listZipCsvMembers(file);
  if(!members.length){showToast('No CSV/TXT inside ZIP');return [];}
  appendImportProgress('ZIP contains '+members.length+' CSV/TXT members',10);
  const imported=[];
  let i=0;
  for(const m of members){
    i++;
    appendImportProgress('Reading '+m.name+'...',10+Math.floor((i/members.length)*25));
    const text=await zipMemberText(m);
    const parsed=csvToObjects(text,S.importLimit,(done,total)=>{
      if(done%5000===0) setImportProgress(`Parsing ${m.name}: ${done.toLocaleString()} / ${total.toLocaleString()} rows`,35+Math.floor((done/Math.max(total,1))*50));
    });
    if(!parsed.headers.length) continue;
    const id='src_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const src={id,name:m.name.split('/').pop(),headers:parsed.headers,rows:parsed.objs,tech:'?',color:COLORS[colorIdx%COLORS.length],fullRows:parsed.totalRows,previewCap:parsed.limited?S.importLimit:null};
    src.tech=detectTechFromMember(m.name,parsed.headers)||inferTech(src);
    colorIdx++;
    S.sources.push(src);
    imported.push(src);
    appendImportProgress(`✓ ${src.name}: ${src.rows.length.toLocaleString()} rows${parsed.limited?' preview of '+parsed.totalRows.toLocaleString():''}`,60+Math.floor((i/members.length)*35));
    await new Promise(r=>setTimeout(r,0));
  }
  persist();
  return imported;
}

// ───────────────────────────────────────────────────────────
// FILE IMPORT
// ───────────────────────────────────────────────────────────
async function importFile(file){
  showToast('Importing '+file.name+'…');
  setSignal(true);
  try{
    if(file.name.toLowerCase().endsWith('.zip')){
      const imported=await importZipFile(file);
      showToast(`✓ ZIP imported: ${imported.length} source${imported.length!==1?'s':''}`);
      setSignal(false);
      return imported[0]||null;
    }
    return await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        try{
          const text=e.target.result;
          appendImportProgress('Parsing '+file.name+'...',20);
          const {headers,objs,totalRows,limited}=csvToObjects(text,S.importLimit,(done,total)=>{
            if(done%5000===0) setImportProgress(`Parsing ${file.name}: ${done.toLocaleString()} / ${total.toLocaleString()} rows`,20+Math.floor((done/Math.max(total,1))*70));
          });
          if(!headers.length){showToast('⚠️ No headers found');return resolve(null);}
          const id='src_'+Date.now()+'_'+Math.random().toString(36).slice(2);
          const src={id,name:file.name,headers,rows:objs,
            tech:'?',color:COLORS[colorIdx%COLORS.length],fullRows:totalRows,previewCap:limited?S.importLimit:null};
          src.tech=inferTech(src);
          colorIdx++;
          S.sources.push(src);
          persist();
          appendImportProgress(`✓ ${file.name}: ${objs.length.toLocaleString()} rows${limited?' preview of '+totalRows.toLocaleString():''}, ${headers.length} cols`,100);
          showToast(`✓ ${file.name}: ${objs.length.toLocaleString()} rows${limited?' preview':''}`);
          setSignal(false);
          resolve(src);
        }catch(err){
          showToast('⚠️ Parse error: '+err.message);
          setSignal(false);
          resolve(null);
        }
      };
      reader.onerror=()=>{showToast('⚠️ Read error');setSignal(false);resolve(null);};
      reader.readAsText(file,'utf-8');
    });
  }catch(err){
    showToast('⚠️ '+err.message);
    appendImportProgress('ERROR: '+err.message,0);
    setSignal(false);
    return null;
  }
}

function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('Copied!'));
  } else {
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    showToast('Copied!');
  }
}

function resultsToCsv(rows){
  if(!rows.length) return '';
  const ks=Object.keys(rows[0]).filter(k=>!k.startsWith('_'));
  const lines=[ks.join(',')];
  for(const r of rows){
    lines.push(ks.map(k=>`"${(r[k]||'').toString().replace(/"/g,'""')}"`).join(','));
  }
  return lines.join('\n');
}

function tableToText(rows){
  if(!rows.length) return '';
  const ks=Object.keys(rows[0]).filter(k=>!k.startsWith('_'));
  const widths=ks.map(k=>Math.max(k.length,...rows.map(r=>(r[k]||'').toString().length)));
  const line=widths.map(w=>'-'.repeat(w));
  const fmt=r=>ks.map((k,i)=>(r[k]||'').toString().padEnd(widths[i])).join(' | ');
  return [fmt(Object.fromEntries(ks.map(k=>[k,k]))),
    line.join('-+-'),...rows.map(fmt)].join('\n');
}

// RUN ANALYTICS QUERY
function runQuery(qid){
  if(!S.sources.length){showToast('Import data first');return;}
  const qdef=QUERIES.find(q=>q.id===qid);
  if(!qdef) return;
  setSignal(true);
  setTimeout(()=>{
    try{
      const result=qdef.fn();
      setSignal(false);
      showQueryResult(qdef.title,result);
    }catch(e){
      setSignal(false);
      showToast('⚠️ '+e.message);
    }
  },50);
}

function showQueryResult(title,result){
  let body='';
  if(!result){
    body='<div class="empty-state"><p>No results</p></div>';
  } else if(result.summary!==undefined){
    // Q03 style with summary + rows
    const rows=result.rows||[];
    body=`<div class="result-block">${escHtml(result.summary)}</div>${renderResultTable(rows.slice(0,100))}`;
  } else if(Array.isArray(result)){
    if(!result.length) body='<div class="empty-state"><p>No data found in loaded sources for this query</p></div>';
    else body=renderResultTable(result.slice(0,200));
  } else {
    body=`<div class="result-block">${escHtml(JSON.stringify(result,null,2))}</div>`;
  }

  const copyStr=Array.isArray(result)?tableToText(result.slice(0,200)):'';
  openModal(title,body,`
<button class="btn btn-secondary" onclick="copyText(${JSON.stringify(copyStr)})">Copy</button>
<button class="btn btn-primary" onclick="closeModal()">Done</button>`);
}

function renderResultTable(rows){
  if(!rows||!rows.length) return '';
  const ks=Object.keys(rows[0]).filter(k=>!k.startsWith('_'));
  return `<div class="bsc-table-wrap"><table class="result-table">
    <thead><tr>${ks.map(k=>`<th>${escHtml(k)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${ks.map(k=>`<td>${escHtml(String(r[k]||''))}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function normalizeAiText(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9. ]/g,' ');}
function findBscInText(text){
  const t=normalizeAiText(text).replace(/\s+/g,'');
  return BSC_CATALOG.find(b=>t.includes(String(b.name).toUpperCase()))||null;
}
function findSiteToken(text){
  const t=String(text||'').toUpperCase();
  const b=findBscInText(text); if(b) return b.name;
  const m=t.match(/\b[A-Z]{2,5}\d[A-Z0-9]{2,8}\b/);
  return m?m[0]:'';
}
function rowsMatchingSite(site){
  if(!site) return [];
  const key=normSite(site);
  const out=[];
  for(const s of S.sources){
    const siteCols=s.headers.filter(h=>/^(site|node|bts|bts_name|btsname|cellname|cell_name)$/i.test(h) || /site|node|bts|cell/i.test(h));
    for(const r of s.rows){
      const ok=siteCols.some(c=>normSite(cv(r,c)).includes(key) || key.includes(normSite(cv(r,c))));
      if(ok) out.push({_source:s.name,_tech:s.tech,_headers:s.headers,...r});
    }
  }
  return out;
}
function findBestCol(headers, aliases){return findCol(headers, aliases)||'';}
function rowsToCountTable(rows, col){
  const map={};
  for(const r of rows){const v=(r[col]||'').toString().trim()||'(blank)'; map[v]=(map[v]||0)+1;}
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([Value,Count])=>({Value,Count}));
}
function bscTableText(rows){
  return rows.map(b=>`${b.name} | ${b.type} | ${b.om} | Exchange ${b.exchangeId} | ${b.city} | ${b.location}`).join('\n');
}
function localBscAnswer(q){
  const b=findBscInText(q);
  if(b) return `EMBEDDED BSC O&M REFERENCE\n\n${b.name}\nNode Type: ${b.type}\nO&M IP: ${b.om}\nExchange ID: ${b.exchangeId}\nCity: ${b.city}\nLocation: ${b.location}\n\nSource: embedded BSC reference supplied by Abu Mohammed.`;
  const t=String(q||'').toLowerCase();
  let rows=BSC_CATALOG;
  const ex=t.match(/exchange\s*(id)?\s*(\d{3})|\b(\d{3})\b/);
  if(ex){const id=ex[2]||ex[3]; rows=rows.filter(b=>b.exchangeId===id);}
  for(const city of ['makkah','madinah','taif','abha','baha','khamis']){
    if(t.includes(city)) rows=rows.filter(b=>b.city.toLowerCase().includes(city));
  }
  if(t.includes('bsc')||t.includes('o&m')||t.includes('om ip')||t.includes('exchange')||t.includes('location')){
    return `EMBEDDED BSC O&M REFERENCE — ${rows.length} record(s)\n\n${bscTableText(rows.slice(0,80))}`;
  }
  return '';
}
function localHwAnswer(q){
  const site=findSiteToken(q);
  const hwSources=S.sources.filter(s=>s.tech==='HW' || /hw|hardware|unit|serial/i.test(s.name+' '+s.headers.join(' ')));
  if(!hwSources.length) return 'No HW dump is loaded yet. Import HW ZIP/CSV, then ask again.';
  let rows=[];
  if(site) rows=rowsMatchingSite(site).filter(r=>String(r._tech).toUpperCase()==='HW' || /HW|Hardware/i.test(r._source||''));
  else for(const s of hwSources) rows.push(...s.rows.map(r=>({_source:s.name,_tech:s.tech,_headers:s.headers,...r})));
  if(!rows.length) return `No HW rows found for ${site}. Check site spelling or import full HW dump.`;
  const headers=rows[0]._headers||Object.keys(rows[0]);
  const unitCol=findBestCol(headers,['UNIT_TYPE','unittype','unit_type','hwtype','productname','type']);
  if(!unitCol) return 'HW rows found, but no UNIT_TYPE / hardware type column was detected.';
  const table=rowsToCountTable(rows,unitCol).slice(0,80).map(x=>({Unit_Type:x.Value,Count:x.Count}));
  return `OFFLINE AI — HW UNIT TYPES${site?' for '+site:''}\nRows used: ${rows.length.toLocaleString()}\nColumn: ${unitCol}\n\n${tableToText(table)}`;
}
function localSite360Answer(q){
  const site=findSiteToken(q);
  if(!site) return '';
  const rows=rowsMatchingSite(site);
  if(!rows.length) return `No local CM/HW rows found for ${site}. Try importing data or check the site name.`;
  const bySrc={}; const byTech={};
  for(const r of rows){bySrc[r._source]=(bySrc[r._source]||0)+1; byTech[r._tech]=(byTech[r._tech]||0)+1;}
  const bsc=findBscInText(site)||findBscInText(q);
  let out=`SITE 360 — ${site}\n\nRows found: ${rows.length.toLocaleString()}\nBy technology/source type:\n${Object.entries(byTech).map(([k,v])=>`- ${k}: ${v}`).join('\n')}\n\nBy source:\n${Object.entries(bySrc).map(([k,v])=>`- ${k}: ${v}`).join('\n')}`;
  if(bsc) out += `\n\nEmbedded BSC reference:\n${bscTableText([bsc])}`;
  out += `\n\nSample evidence:\n${rows.slice(0,8).map(r=>Object.entries(r).filter(([k,v])=>!k.startsWith('_')&&v).slice(0,8).map(([k,v])=>`${k}=${v}`).join(' | ')).join('\n')}`;
  return out;
}
function sourceStructureAnswer(){
  if(!S.sources.length) return 'No data loaded yet. Import CM/HW files first.';
  return `LOCAL DB STRUCTURE\n\n${S.sources.map(s=>`- ${s.name}: ${s.rows.length.toLocaleString()} rows, tech=${s.tech}, columns=${s.headers.length}\n  ${s.headers.slice(0,30).join(', ')}${s.headers.length>30?', ...':''}`).join('\n')}`;
}
function quickQuestionsAnswer(){
  return 'QUICK AI QUESTIONS Q01–Q60\n\n' + QUERIES.map((q,i)=>`Q${String(i+1).padStart(2,'0')} — ${q.title}`).join('\n');
}
function runQueryByIntent(q){
  const t=q.toLowerCase();
  let qdef=null;
  const qnum=t.match(/\bq\s*([0-9]{1,2})\b/i);
  if(qnum) qdef=QUERIES[parseInt(qnum[1],10)-1];
  else if(t.includes('software')||t.includes('sw version')) qdef=QUERIES.find(x=>x.id==='q11');
  else if(t.includes('combined')||t.includes('2g+4g+5g')) qdef=QUERIES.find(x=>x.id==='q18');
  else if(t.includes('duplicate')&&t.includes('ip')) qdef=QUERIES.find(x=>x.id==='q08');
  else if(t.includes('5g')&&t.includes('4g')&&t.includes('missing')) qdef=QUERIES.find(x=>x.id==='q06');
  if(!qdef) return '';
  try{
    const res=qdef.fn();
    if(Array.isArray(res)) return `OFFLINE AI — ${qdef.title}\n\n${tableToText(res.slice(0,120))}`;
    if(res && res.summary!==undefined) return `OFFLINE AI — ${qdef.title}\n\n${res.summary}\n\n${tableToText((res.rows||[]).slice(0,120))}`;
    return `OFFLINE AI — ${qdef.title}\n\n${JSON.stringify(res,null,2)}`;
  }catch(e){return `Question ${qdef.title} could not run: ${e.message}`;}
}
function offlineAiAnswer(q){
  const t=String(q||'').toLowerCase();
  if(t.includes('60') || t.includes('quick ai') || t.includes('questions')) return quickQuestionsAnswer();
  if(t.includes('structure')||t.includes('columns')||t.includes('headers')||t.includes('loaded data')) return sourceStructureAnswer();
  const bsc=localBscAnswer(q); if(bsc) return bsc;
  if(t.includes('hardware')||t.includes('hw')||t.includes('unit type')||t.includes('serial')) return localHwAnswer(q);
  if(t.includes('site 360')||findSiteToken(q)) {
    const ans=localSite360Answer(q); if(ans) return ans;
  }
  const qi=runQueryByIntent(q); if(qi) return qi;
  if(S.sources.length){
    const oldQ=S.query;
    S.query=q; runSearch(q);
    const hits=S.results.slice(0,20);
    S.query=oldQ;
    if(hits.length) return `OFFLINE AI SEARCH RESULT\nFound ${hits.length} top matching row(s) for: ${q}\n\n${hits.map((r,i)=>`${i+1}. ${Object.entries(r).filter(([k,v])=>!k.startsWith('_')&&v).slice(0,8).map(([k,v])=>`${k}=${v}`).join(' | ')}`).join('\n')}`;
  }
  return 'Offline AI is ready. Ask about embedded BSC O&M IPs, a site name, HW unit types, software versions, or Quick AI Q01–Q60. Import CM/HW data for local database answers.';
}
function buildChatGptPrompt(question){
  const q=question || (S.chatHistory.slice().reverse().find(m=>m.role==='user')||{}).content || '';
  const local=offlineAiAnswer(q);
  return `You are Nokia Operations Intelligence expert. Use the controlled local evidence below and answer clearly.\n\nUSER QUESTION:\n${q}\n\nLOCAL OFFLINE AI ANSWER / EVIDENCE:\n${local}\n\nLOADED SOURCES SUMMARY:\n${S.sources.length?S.sources.map(s=>`- ${s.name}: ${s.rows.length} rows, tech=${s.tech}, columns=[${s.headers.slice(0,20).join(', ')}]`).join('\n'):'No CM/HW files loaded in browser.'}\n\nEMBEDDED BSC REFERENCE SAMPLE:\n${bscTableText(BSC_CATALOG.slice(0,20))}\n\nPlease explain calculation, risks, and next checks. Do not invent values not supported by evidence.`;
}
function copyChatGptContext(){
  const inp=document.getElementById('aiInput');
  const q=(inp&&inp.value.trim()) || (S.chatHistory.slice().reverse().find(m=>m.role==='user')||{}).content || 'Summarize Nokia OI local evidence';
  copyText(buildChatGptPrompt(q));
  showToast('ChatGPT context copied');
}

// ───────────────────────────────────────────────────────────
// AI CHAT
// ───────────────────────────────────────────────────────────
function clearChat(){S.chatHistory=[];render();}

async function sendAiMessage(){
  const inp=document.getElementById('aiInput');
  const msg=(inp.value||'').trim();
  if(!msg) return;

  S.chatHistory.push({role:'user',content:msg});
  if(!S.apiKey && !S.hybridUrl){
    const text=offlineAiAnswer(msg);
    S.chatHistory.push({role:'assistant',content:text});
    inp.value='';inp.style.height='auto';
    render();
    const msgs_el=document.getElementById('aiMessages');
    if(msgs_el) msgs_el.scrollTop=msgs_el.scrollHeight;
    return;
  }

  inp.value='';inp.style.height='auto';
  document.getElementById('aiSendBtn').disabled=true;
  setSignal(true);

  // Build context from loaded data
  const dataCtx=S.sources.length?
    `\n\nLoaded Nokia data sources:\n${S.sources.map(s=>`- ${s.name}: ${s.rows.length} rows, tech=${s.tech}, columns=[${s.headers.slice(0,15).join(', ')}]`).join('\n')}\n\nSample rows (first 3 of each source):\n${S.sources.map(s=>s.rows.slice(0,3).map(r=>JSON.stringify(r)).join('\n')).join('\n---\n')}`:
    '\n\nNo data loaded yet.';

  const sysPrompt=`You are Nokia Operations Intelligence AI, an expert Nokia RAN (2G/4G/5G) network assistant. Analyze controlled local evidence from the browser. Be concise and technical. Answer in the same language as the user's question.\n\nOffline deterministic answer/evidence for current question:\n${offlineAiAnswer(msg)}${dataCtx}`;

  const msgs=S.chatHistory.map(m=>({role:m.role,content:m.content}));

  try{
    // Detect API type
    const isAnthropic=S.apiKey.startsWith('sk-ant')||(!S.hybridUrl&&!S.apiKey.startsWith('sk-'));
    const endpoint=S.hybridUrl||(isAnthropic?'https://api.anthropic.com/v1/messages':'https://api.openai.com/v1/chat/completions');

    let response,text;
    if(isAnthropic&&!S.hybridUrl){
      response=await fetch(endpoint,{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,system:sysPrompt,
          messages:msgs.slice(-10)})});
      const d=await response.json();
      text=(d.content||[]).map(b=>b.type==='text'?b.text:'').join('');
      if(d.error) throw new Error(d.error.message);
    } else {
      // OpenAI / custom endpoint
      response=await fetch(endpoint,{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
        body:JSON.stringify({model:'gpt-4o-mini',max_tokens:1500,
          messages:[{role:'system',content:sysPrompt},...msgs.slice(-10)]})});
      const d=await response.json();
      text=(d.choices||[{message:{content:''}}])[0].message.content;
      if(d.error) throw new Error(d.error.message);
    }

    S.chatHistory.push({role:'assistant',content:text});
  }catch(e){
    S.chatHistory.push({role:'assistant',content:'Error: '+e.message});
  }

  setSignal(false);
  render();
  const msgs_el=document.getElementById('aiMessages');
  if(msgs_el) msgs_el.scrollTop=msgs_el.scrollHeight;
  document.getElementById('aiSendBtn').disabled=false;
}

// ───────────────────────────────────────────────────────────
// FILE INPUT HANDLER
// ───────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];
  if(!files.length) return;
  S.importProgress=''; S.importPct=0;
  let done=0;
  for(const f of files){
    done++;
    appendImportProgress(`Starting ${done}/${files.length}: ${f.name}`, Math.floor((done-1)/files.length*100));
    await importFile(f);
    await new Promise(r=>setTimeout(r,0));
  }
  e.target.value='';  // reset so same file can be re-imported
  if(S.tab==='import'||S.tab==='search') render();
  else{S.tab='import';render();}
});

// ───────────────────────────────────────────────────────────
// KEYBOARD HANDLING
// ───────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
});

// Prevent body scroll bounce on iOS
document.addEventListener('touchmove',e=>{
  if(e.target.closest('.content,.ai-messages,.modal-body,.bsc-table-wrap')) return;
  e.preventDefault();
},{passive:false});


function showLocalFileWarningIfNeeded(){
  try{
    if(location.protocol==='file:'){
      setTimeout(()=>showToast('Local file mode detected. If import/save fails, open through HTTPS/GitHub Pages.',6000),1000);
    }
  }catch(e){}
}


// ───────────────────────────────────────────────────────────
// OFFLINE PWA SERVICE WORKER REGISTRATION — v1.0.8
// ───────────────────────────────────────────────────────────
function addOfflinePill(text,cls){
  try{
    let el=document.getElementById('offlinePill');
    if(!el){el=document.createElement('div');el.id='offlinePill';document.body.appendChild(el);}
    el.className='offline-pill '+(cls||'');
    el.textContent=text;
  }catch(e){}
}
async function registerOfflinePWA(){
  try{
    if(!('serviceWorker' in navigator)){
      addOfflinePill('Offline cache unsupported','warn');
      return;
    }
    const reg=await navigator.serviceWorker.register('./sw.js?v=108');
    addOfflinePill(navigator.onLine?'Offline cache ready':'Offline mode','ok');
    if(reg && reg.update) reg.update().catch(()=>{});
    window.addEventListener('online',()=>addOfflinePill('Online + cached','ok'));
    window.addEventListener('offline',()=>addOfflinePill('Offline mode','ok'));
  }catch(e){
    addOfflinePill('Open via HTTPS for offline cache','warn');
  }
}

// ───────────────────────────────────────────────────────────
// INIT
// ───────────────────────────────────────────────────────────
restore();
render();
showLocalFileWarningIfNeeded();
registerOfflinePWA();

if(!localStorage.getItem('noi_launched')){
  localStorage.setItem('noi_launched','1');
  setTimeout(()=>{
    if(window.navigator.standalone===false){
      showToast('Tip: Add to Home Screen for full-screen offline use',4000);
    }
  },2000);
}
